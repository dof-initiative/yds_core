plugins {
    id 'base'
}

def yamlExtension = ".yaml"
def rootElementName = "model"
def schemaElementName = "yds_core"
def schemaElementPath = "$rootElementName.$schemaElementName"
def rootElementSrcDirPath = "$projectDir/$rootElementName"
def unifiedSchemaBuildPath = "$buildDir/$schemaElementName$yamlExtension"

tasks.register('loadUnifiedSchemaAsYaml', Exec) {
    inputs.files(fileTree("$rootElementSrcDirPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$buildDir"))
    commandLine "bash", "-c", "npm exec -- yds-load $projectDir -e $schemaElementPath > $unifiedSchemaBuildPath"
}

tasks.register('buildUnifiedSchema', Exec) {
    dependsOn(loadUnifiedSchemaAsYaml)
    inputs.files(fileTree("$rootElementSrcDirPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$buildDir"))
    commandLine "bash", "-c", "gen-yaml $unifiedSchemaBuildPath --mergeimports"
}

tasks.named("assemble") {
    dependsOn(buildUnifiedSchema)
}

