plugins {
    id 'base'
}

def yamlExtension = ".yaml"
def rootElementName = "model"
def targetElementName = "yds_core"
def loadedElementName = "loaded_$targetElementName"
def mergedElementName = "merged_$targetElementName"
def targetElementPath = "$rootElementName.$targetElementName"
def rootElementSrcDirPath = "$projectDir/$rootElementName"
def loadedSchemaBuildPath = "$buildDir/$loadedElementName$yamlExtension"
def mergedSchemaBuildPath = "$buildDir/$mergedElementName$yamlExtension"
def unifiedSchemaBuildPath = "$buildDir/$targetElementName$yamlExtension"
def schemaValidationHelperSrcDirPath = "$projectDir/src"
def distDir = "$projectDir/dist"

tasks.register('buildSchemaValidationHelper', Exec) {
    inputs.files(fileTree("$schemaValidationHelperSrcDirPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$distDir"))
    commandLine "bash", "-c", "npm run build"
}

tasks.register('loadUnifiedSchemaAsYaml', Exec) {
    dependsOn(buildSchemaValidationHelper)
    inputs.files(fileTree("$rootElementSrcDirPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$buildDir"))
    commandLine "bash", "-c", "npm exec -- yds-load $projectDir -e $targetElementPath > $loadedSchemaBuildPath"
}

tasks.register('buildUnifiedSchema', Exec) {
    dependsOn(loadUnifiedSchemaAsYaml)
    inputs.files(fileTree("$rootElementSrcDirPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$buildDir"))
    commandLine "bash", "-c", "gen-yaml $loadedSchemaBuildPath --mergeimports > $mergedSchemaBuildPath"
}

tasks.register('removeExtraNewlinesFromComplexStrings', Exec) {
    dependsOn(buildUnifiedSchema)
    inputs.files(fileTree("$rootElementSrcDirPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$buildDir"))
    commandLine "bash", "-c", "./bin/clean-merged-schema.js $mergedSchemaBuildPath > $unifiedSchemaBuildPath"
}

tasks.register('cleanupMergedImports', Exec) {
    dependsOn(removeExtraNewlinesFromComplexStrings)
    inputs.files(fileTree("$rootElementSrcDirPath"))
        .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$buildDir"))
    commandLine "yq", "-i", "del(.imports)", "$unifiedSchemaBuildPath"
}

tasks.named("assemble") {
    dependsOn(cleanupMergedImports)
}

tasks.register('runSchemaTest', Exec) {
    dependsOn(assemble)
    commandLine "bash", "-c", "npm run test"
}

tasks.named("build") {
    dependsOn(runSchemaTest)
}

tasks.named("clean") {
    delete "$buildDir", "$distDir"
}
